version: 2

project_name: go-haspr-cli
checksum:
  name_template: 'checksums.txt'
builds:
  - id: haspr
    env: [CGO_ENABLED=0]
    flags:
      - -trimpath
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    binary: haspr
  - id: git-credential-haspr
    env: [CGO_ENABLED=0]
    flags:
      - -trimpath
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    binary: git-credential-haspr
  - id: docker-credential-haspr
    env: [CGO_ENABLED=0]
    flags:
      - -trimpath
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    binary: docker-credential-haspr
  - id: pbolt
    env: [CGO_ENABLED=0]
    flags:
      - -trimpath
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    binary: pbolt
  - id: git-credential-pbolt
    env: [CGO_ENABLED=0]
    flags:
      - -trimpath
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    binary: git-credential-pbolt
  - id: docker-credential-pbolt
    env: [CGO_ENABLED=0]
    flags:
      - -trimpath
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    binary: docker-credential-pbolt
  - id: git-credential-passbolt
    env: [CGO_ENABLED=0]
    flags:
      - -trimpath
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    binary: git-credential-passbolt
  - id: docker-credential-passbolt
    env: [CGO_ENABLED=0]
    flags:
      - -trimpath
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    binary: docker-credential-passbolt
archives:
  - name_template: "haspr_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - completion/*
      - man/*
    format_overrides:
      - goos: windows
        formats: [zip]
release:
  draft: true
  header: |
    ## Release {{ .Tag }} - ({{ .Date }})
nfpms:
  - maintainer: haspr contributors <https://github.com/haspr-dev>
    description: A CLI tool to interact with Passbolt.
    homepage: https://github.com/haspr-dev/go-haspr-cli
    license: MIT
    contents:
      - src: completion/bash
        dst: /usr/share/bash-completion/completions/haspr
      - src: completion/zsh
        dst: /usr/share/zsh/site-functions/_haspr
      - src: completion/fish
        dst: /usr/share/fish/vendor_completions.d/haspr.fish
      - src: man/*
        dst: /usr/share/man/man1/
    recommends:
      - bash_completion
    formats:
      - deb
      - rpm
brews:
  - name: haspr
    homepage: https://github.com/haspr-dev/go-haspr-cli
    license: "MIT"
    skip_upload: true
    description: "A CLI tool to interact with Passbolt, an open source password manager for teams"
    directory: Formula
    install: |
      bin.install "haspr", "git-credential-haspr", "docker-credential-haspr", "pbolt", "git-credential-pbolt", "docker-credential-pbolt", "git-credential-passbolt", "docker-credential-passbolt"
      # Compatibility symlink
      bin.install_symlink "haspr" => "passbolt"
      bash_completion.install "completion/bash" => "haspr"
      zsh_completion.install "completion/zsh" => "_haspr"
      fish_completion.install "completion/fish" => "haspr.fish"
      man1.install Dir["man/*"]
    repository:
      owner: haspr-dev
      name: homebrew-tap

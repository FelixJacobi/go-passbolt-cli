version: 2

project_name: go-pbolt-cli
checksum:
  name_template: 'checksums.txt'
builds:
  - id: pbolt
    env: [CGO_ENABLED=0]
    flags:
      - -trimpath
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    binary: pbolt
  - id: git-credential-pbolt
    env: [CGO_ENABLED=0]
    flags:
      - -trimpath
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    binary: git-credential-pbolt
  - id: docker-credential-pbolt
    env: [CGO_ENABLED=0]
    flags:
      - -trimpath
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    binary: docker-credential-pbolt
  - id: git-credential-passbolt
    env: [CGO_ENABLED=0]
    flags:
      - -trimpath
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    binary: git-credential-passbolt
  - id: docker-credential-passbolt
    env: [CGO_ENABLED=0]
    flags:
      - -trimpath
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    binary: docker-credential-passbolt
  - id: passbolt-browser-host
    main: ./cmd/passbolt-browser-host
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    binary: passbolt-browser-host
archives:
  - name_template: "pbolt_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - completion/*
      - man/*
    format_overrides:
      - goos: windows
        formats: [zip]
release:
  draft: true
  header: |
    ## Release {{ .Tag }} - ({{ .Date }})
nfpms:
  - maintainer: pbolt contributors <https://github.com/pbolt-dev>
    description: A CLI tool to interact with Passbolt.
    homepage: https://github.com/pbolt-dev/go-pbolt-cli
    license: MIT
    contents:
      - src: completion/bash
        dst: /usr/share/bash-completion/completions/pbolt
      - src: completion/zsh
        dst: /usr/share/zsh/site-functions/_pbolt
      - src: completion/fish
        dst: /usr/share/fish/vendor_completions.d/pbolt.fish
      - src: man/*
        dst: /usr/share/man/man1/
    recommends:
      - bash_completion
    formats:
      - deb
      - rpm
brews:
  - homepage: https://github.com/pbolt-dev/go-pbolt-cli
    license: "MIT"
    skip_upload: true
    description: "A CLI tool to interact with Passbolt, an open source password manager for teams"
    directory: Formula
    install: |
      bin.install "pbolt", "git-credential-pbolt", "docker-credential-pbolt", "git-credential-passbolt", "docker-credential-passbolt", "passbolt-browser-host"
      # Compatibility symlink
      bin.install_symlink "pbolt" => "passbolt"
      bash_completion.install "completion/bash" => "pbolt"
      zsh_completion.install "completion/zsh" => "_pbolt"
      fish_completion.install "completion/fish" => "pbolt.fish"
      man1.install Dir["man/*"]
    repository:
      owner: pbolt-dev
      name: homebrew-tap

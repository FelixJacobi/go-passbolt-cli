name: Update Homebrew Tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.4.2)'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  homebrew:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    steps:
      - name: Download Homebrew Formula from release workflow
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          echo "Waiting for successful .release.yml run for tag $TAG..."
          RUN_ID=""
          for i in $(seq 1 30); do
            RUN_ID=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow=.release.yml \
              --branch="$TAG" \
              --status=success \
              --limit=1 \
              --json databaseId \
              --jq '.[0].databaseId')
            if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
              break
            fi
            echo "Attempt $i/30: .release.yml not finished yet. Waiting 20s..."
            sleep 20
          done
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::No successful .release.yml run found for tag $TAG"
            exit 1
          fi
          echo "Downloading homebrew-formula from run $RUN_ID"
          mkdir -p formula
          gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --name homebrew-formula \
            --dir formula

      - name: Update Homebrew Tap
        if: ${{ env.TAP_GITHUB_TOKEN != '' }}
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN || secrets.GH_TOKEN }}
        run: |
          git clone https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/haspr-dev/homebrew-tap.git tap
          cp formula/*.rb tap/Formula/
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/*.rb
          git commit -m "Update haspr to ${{ github.event.release.tag_name || inputs.tag }}"
          git push
